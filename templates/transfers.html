<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StockSense - Internal Transfers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 30px;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>

<body>

<div class="navbar">
    StockSense | Internal Transfers
</div>

<div class="container">

    <h1>Create Internal Transfer</h1>

    <form id="transferForm">

        <div class="form-group">
            <label for="product">Product</label>
            <input
                type="text"
                id="product"
                name="product"
                placeholder="Enter product SKU or name"
                required
            >
        </div>

        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input
                type="number"
                id="quantity"
                name="quantity"
                min="1"
                required
            >
        </div>

        <div class="form-group">
            <label for="source">Source Location</label>
            <input
                type="text"
                id="source"
                name="source"
                placeholder="Main Warehouse"
                required
            >
        </div>

        <div class="form-group">
            <label for="destination">Destination Location</label>
            <input
                type="text"
                id="destination"
                name="destination"
                placeholder="Production Floor"
                required
            >
        </div>

        <button type="submit">Create Transfer</button>

    </form>

    <div id="message" class="message"></div>

</div>

<script src="{{ url_for('static', filename='operations.js') }}"></script>

</body>
</html>
